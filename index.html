<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שבת וחג אצל טטיי 🕯️🕯️🍷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>שבת וחג אצל טטיי 🕯️🕯️🍷</h1>

  <!-- טופס הרשמה / עריכה -->
  <div class="form-card" id="formCard">
    <div class="edit-banner" id="editBanner">מצב עריכה פעיל</div>
    <form id="regForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="name">שם מלא / משפחה:</label>
        <input type="text" id="name" placeholder="אדיסה ודסטאו" required>
      </div>
      
      <div class="form-group">
        <label for="date">תאריך האירוע:</label>
        <input type="date" id="date" required onchange="validateDateInput(this.value)">
        <small id="dateError" style="color: red; display: none; margin-top: 4px;"></small>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit" id="submitBtn">אישור הרשמה</button>
        <button type="button" class="btn-cancel" onclick="resetForm()">ביטול</button>
      </div>
    </form>
  </div>

  <!-- תיבת שיתוף WhatsApp -->
  <div class="share-box" id="shareBox">
    <p style="margin-top:0;">✨ ההרשמה התקבלה בהצלחה!</p>
    <a href="#" id="whatsappLink" target="_blank" class="btn-whatsapp">שתף בקבוצת ה-WhatsApp המשפחתית 📱</a>
  </div>

  <!-- מערכת לשוניות -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('future')">שבתות וחגים קרובים</button>
    <button class="tab-btn" onclick="switchTab('history')">היסטוריית הרשמות</button>
  </div>

  <!-- רשימת הרשמות -->
  <div class="cards-list" id="cardsContainer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
