<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שבת וחג אצל טטיי 🕯️🕯️🍷</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #d4af37;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --error-color: #e74c3c;
      --success-color: #2ecc71;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--primary-color);
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    /* תיקון כיווניות שדה התאריך */
    input[type="date"] {
      direction: ltr;
      text-align: right;
    }

    button {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1a252f;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 14px;
    }

    .status-msg.error {
      color: var(--error-color);
    }

    .status-msg.success {
      color: var(--success-color);
    }

    #loading, #registrationsList {
      margin-top: 20px;
    }

    .registration-card {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-right: 4px solid var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>שבת וחג אצל טטיי 🕯️🕯️🍷</h1>
    
    <form id="registrationForm">
      <div class="form-group">
        <label for="name">שם מלא / משפחה:</label>
        <input type="text" id="name" required placeholder="אדיסה ודסטאו">
      </div>

      <div class="form-group">
        <label for="date">תאריך האירוע:</label>
        <input type="date" id="date" dir="ltr" style="text-align: right;" required>
        <div id="dateStatus" class="status-msg"></div>
      </div>

      <div class="form-group">
        <label for="guests">מספר משתתפים:</label>
        <input type="number" id="guests" min="1" value="1" required>
      </div>

      <div class="form-group">
        <label for="notes">הערות נוספות:</label>
        <textarea id="notes" rows="3" placeholder="כשרות, העדפות מזון וכו'"></textarea>
      </div>

      <button type="submit" id="submitBtn">אישור הרשמה</button>
    </form>

    <div id="statusContainer" class="status-msg"></div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">

    <h2>נרשמו עד כה</h2>
    <div id="loading">טוען נתונים...</div>
    <div id="registrationsList"></div>
  </div>

  <script>
    // יש להדביק כאן את הקישור מ-Google Apps Script (המסתניים ב-/exec)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyeLEhyGVsbe_1eMbFDAXDCV5x9OOPw9jvzspdSsPbqDzS3pn0ZIPp5qiSd7ZQ89vO6/exec";

    const form = document.getElementById('registrationForm');
    const statusContainer = document.getElementById('statusContainer');
    const registrationsList = document.getElementById('registrationsList');
    const loadingDiv = document.getElementById('loading');

    // טעינת רשימת הנרשמים ברענון הדף
    document.addEventListener('DOMContentLoaded', fetchRegistrations);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusContainer.textContent = 'שולח נתונים...';
      statusContainer.className = 'status-msg';

      const formData = {
        name: document.getElementById('name').value,
        date: document.getElementById('date').value,
        guests: document.getElementById('guests').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        statusContainer.textContent = 'ההרשמה נקלטה בהצלחה!';
        statusContainer.className = 'status-msg success';
        form.reset();
        fetchRegistrations();
      } catch (error) {
        console.error('Error:', error);
        statusContainer.textContent = 'אירעה שגיאה בשליחת הנתונים. אנא נסה שנית.';
        statusContainer.className = 'status-msg error';
      }
    });

    async function fetchRegistrations() {
      if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        loadingDiv.textContent = 'נא להגדיר כתובת GAS_URL תקינה בקוד.';
        return;
      }

      loadingDiv.style.display = 'block';
      try {
        const response = await fetch(GAS_URL);
        if (!response.ok) throw new Error('Network response failure');
        const data = await response.json();
        
        loadingDiv.style.display = 'none';
        registrationsList.innerHTML = '';

        if (data && data.length > 0) {
          data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'registration-card';
            card.innerHTML = `
              <strong>${item.name}</strong> (${item.guests} משתתפים)<br>
              <small>תאריך: ${item.date}</small>
              ${item.notes ? `<br><small>הערות: ${item.notes}</small>` : ''}
            `;
            registrationsList.appendChild(card);
          });
        } else {
          registrationsList.innerHTML = '<p>עדיין אין נרשמים.</p>';
        }
      } catch (error) {
        console.error('Fetch error:', error);
        loadingDiv.textContent = 'שגיאה בטעינת הנתונים. ודא שההרשאות ב-Apps Script מוגדרות ל-Anyone.';
        loadingDiv.className = 'status-msg error';
      }
    }
  </script>
</body>
</html>
